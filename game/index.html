<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#17252b">
  <meta name="description" content="An original browser game with a scene-first client, a travelling crew, local trade and tactical encounters.">
  <link rel="manifest" href="./manifest.webmanifest">
  <title>Wayfarer's Ledger — Playable Prototype</title>
  <link rel="icon" href="./assets/mark.svg" type="image/svg+xml">
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
  <div class="game-shell">
    <header class="topbar">
      <a class="brand" href="./" aria-label="Wayfarer's Ledger home">
        <img src="./assets/mark.svg" alt="" width="32" height="32">
        <span><strong>WAYFARER'S LEDGER</strong><small>ORIGINAL BROWSER PROTOTYPE</small></span>
      </a>
      <div class="client-heading">
        <small id="screen-eyebrow">FIELD · TOWN</small>
        <strong id="screen-title">Hearthcross</strong>
        <span class="screen-status" id="phase-label"><i class="status-pip"></i> FIELD</span>
      </div>
      <div class="topbar-tools">
        <span class="save-state" id="save-state"><span class="save-dot"></span> SAVED HERE</span>
        <button class="guide-replay" type="button" data-action="onboarding-replay" data-i18n-title="action.guideReplay" aria-haspopup="dialog" title="Replay the quick guide"><span>?</span><b data-i18n="guide.how">HOW TO PLAY</b></button>
        <button class="icon-button" type="button" data-action="reset" data-i18n-aria="action.reset" data-i18n-title="action.reset" aria-label="Start a new journey" title="Start a new journey">↻</button>
      </div>
    </header>
    <main class="game-layout">
      <aside class="portrait-rail" id="portrait-rail" aria-label="Character and mercenary portraits"></aside>
      <section class="client-area" aria-label="Game client">
        <div class="client-stage">
          <div id="notice" class="notice" role="status" aria-live="polite"></div>
          <div id="world-content"></div>
          <div id="mini-map-root"></div>
          <div id="client-window-root"></div>
        </div>
      </section>
      <section class="lower-hud" aria-label="Character status, local chat and client menu">
        <div class="hud-overview" id="overview-strip" aria-label="Character overview"></div>
        <section class="chat-window" aria-label="Local chat and field log">
          <div class="chat-heading"><strong>CHAT / FIELD LOG</strong><small>LOCAL ONLY</small></div>
          <div class="chat-feed" id="chat-feed" aria-live="polite"></div>
          <form id="local-chat-form" class="chat-entry">
            <label class="sr-only" for="chat-message">Add a local note</label>
            <input id="chat-message" name="chat-message" maxlength="160" autocomplete="off" placeholder="Write a local note…">
            <button type="submit" aria-label="Add local note">↵</button>
          </form>
        </section>
        <nav class="client-menu" id="client-menu" aria-label="Client menu"></nav>
        <div class="hud-date"><small>FIELD CALENDAR</small><strong><span id="day-count">01</span></strong><span>DAY</span><i>LOCAL TIME</i></div>
      </section>
    </main>
    <div id="guide-layer"></div>
  </div>
  <script type="module" src="./app.mjs"></script>
</body>
</html>
